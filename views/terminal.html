<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>homelab // node-01 — CRT Phosphor Terminal (1280×400)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     2 · CRT GREEN PHOSPHOR TERMINAL — homelab // node-01
     Self-contained. Fixed 1280×400, letterboxed on black.
     ============================================================ */
  :root{
    --p:   #5dff8b;   /* phosphor green            */
    --pb:  #aaffc4;   /* bright phosphor highlight */
    --pd:  #2a8f4f;   /* dim phosphor (empties)    */
    --pdd: #14502b;   /* very dim (rules/ghost)    */
    --amber: #ffb24a; /* WARN amber                */
    --amberd:#7a4f18;
    --bg:  #020803;   /* near-black green-tinted   */
    --glow: 0 0 4px rgba(93,255,139,.55), 0 0 11px rgba(93,255,139,.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    cursor:none;
  }
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* The fixed logical canvas. JS scales it to fill the viewport. */
  #stage{
    position:relative;
    flex-shrink:0;            /* never shrink below 1280×400 in a narrow viewport */
    width:1280px;
    height:400px;
    transform-origin:center center;
    background:var(--bg);
    color:var(--p);
    font-family:'Share Tech Mono','VT323',ui-monospace,'SF Mono',monospace;
    font-size:13px;
    line-height:1.0;
    overflow:hidden;
    text-shadow:var(--glow);
    /* subtle baseline brightness pulse of the whole tube */
    animation:tubepulse 5.5s ease-in-out infinite;
  }
  @keyframes tubepulse{
    0%,100%{ filter:brightness(1.0); }
    50%    { filter:brightness(1.06); }
  }

  /* ---- layout grid: header / 3 columns / ticker ---- */
  .frame{
    position:absolute; inset:0;
    display:grid;
    grid-template-rows:34px 1fr 26px;
    padding:8px 10px 6px 10px;
    z-index:2;
  }

  /* ---------- HEADER ---------- */
  .hdr{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--pdd);
    padding:0 2px 6px 2px;
    letter-spacing:.06em;
  }
  .hdr .brand{ color:var(--pb); font-size:18px; letter-spacing:.10em; }
  .hdr .brand .cur{
    display:inline-block; width:9px; margin-left:1px;
    color:var(--pb);
    animation:blink 1.06s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  .hdr .meta{ font-size:11px; color:var(--pd); letter-spacing:.04em; text-align:right; }
  .hdr .meta b{ color:var(--p); font-weight:normal; }

  /* ---------- COLUMNS ---------- */
  .cols{
    display:grid;
    grid-template-columns:1.55fr 1px 1.05fr 1px 1.18fr;
    column-gap:0;
    min-height:0;            /* allow children to shrink for scroll */
    padding-top:6px;
  }
  .rule{ background:var(--pdd); width:1px; box-shadow:0 0 6px rgba(93,255,139,.25); }
  .col{ display:flex; flex-direction:column; min-height:0; padding:0 14px; }
  .col:first-child{ padding-left:2px; }
  .col:last-child{ padding-right:2px; }

  .ctitle{
    font-size:11px; letter-spacing:.22em; color:var(--pb);
    margin-bottom:6px; flex:0 0 auto;
    border-bottom:1px dotted var(--pdd); padding-bottom:4px;
  }
  .ctitle .hash{ color:var(--pd); }

  /* ----- SYSTEM LOG column ----- */
  #log{
    flex:1 1 auto; min-height:0;
    overflow:hidden;            /* JS keeps it pinned to bottom */
    font-size:12px; line-height:1.32;
    position:relative;
  }
  #logInner{ position:absolute; left:0; right:0; bottom:0; }
  .ll{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ll .t{ color:var(--pd); }                       /* timestamp  */
  .ll .src{ color:var(--pb); }                     /* service    */
  .ll .msg{ color:var(--p); }
  .ll.warn .msg, .ll.warn .src{ color:var(--amber); }
  .ll.warn .lvl{ color:var(--amber); }
  .ll .lvl{ color:var(--pd); }
  .ll.fresh{ animation:fadein .5s ease-out; }
  @keyframes fadein{ from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;} }

  /* ----- VITALS column ----- */
  #vitals{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:flex-start; gap:13px; padding-top:4px; }
  .vrow{ font-size:13px; letter-spacing:.02em; }
  .vrow .vlabel{ display:inline-block; width:42px; color:var(--pb); }
  .vrow .vbar{ color:var(--pd); letter-spacing:1px; }
  .vrow .vbar .fill{ color:var(--p); }
  .vrow .vval{ color:var(--pb); }
  .vrow.hot .vbar .fill, .vrow.hot .vval{ color:var(--amber); }
  .vrow .vunit{ color:var(--pd); font-size:11px; }
  .vmini{ font-size:10px; color:var(--pd); margin-top:13px; letter-spacing:.06em; line-height:1.5; border-top:1px dotted var(--pdd); padding-top:8px; }
  .vmini b{ color:var(--p); font-weight:normal; }

  /* ----- STATUS column ----- */
  #status{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .clock{
    font-family:'VT323','Share Tech Mono',ui-monospace,monospace;
    font-size:58px; line-height:.82; color:var(--pb);
    letter-spacing:.02em;
    text-shadow:0 0 6px rgba(170,255,196,.6), 0 0 16px rgba(93,255,139,.4);
  }
  .clock .sec{ font-size:30px; color:var(--p); }
  .dateline{ font-size:12px; color:var(--pd); letter-spacing:.10em; margin:3px 0 2px; }
  .dateline b{ color:var(--p); font-weight:normal; }
  .uprow{ font-size:12px; color:var(--pd); letter-spacing:.06em; margin-bottom:7px; }
  .uprow b{ color:var(--pb); font-weight:normal; }
  .svchdr{ font-size:10px; letter-spacing:.2em; color:var(--pd); border-top:1px dotted var(--pdd); padding-top:6px; margin-bottom:3px; }
  #svc{ flex:1 1 auto; min-height:0; overflow:hidden; font-size:12px; line-height:1.42; }
  .svc{ display:flex; justify-content:space-between; white-space:nowrap; }
  .svc .name{ color:var(--p); }
  .svc .tag{ color:var(--pb); }
  .svc .tag.ok{ color:var(--p); }
  .svc .tag.warn{ color:var(--amber); animation:warnpulse 1.1s steps(2) infinite; }
  @keyframes warnpulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }
  .svc .dots{ color:var(--pdd); flex:1 1 auto; overflow:hidden; margin:0 4px; }

  /* ---------- TICKER ---------- */
  .ticker{
    border-top:1px solid var(--pdd);
    overflow:hidden; white-space:nowrap; position:relative;
    display:flex; align-items:center;
    font-size:12px; letter-spacing:.12em; color:var(--pb);
    margin-top:4px;
  }
  .ticker .track{
    display:inline-block; white-space:nowrap; will-change:transform;
    padding-left:100%;          /* start off-screen right (filled by JS dup) */
  }
  .ticker .sep{ color:var(--pd); margin:0 14px; }
  .ticker .lead{ color:var(--p); }

  /* ============================================================
     CRT OVERLAY LAYERS (all pointer-events:none, inside #stage)
     ============================================================ */
  .crt{ position:absolute; inset:0; pointer-events:none; }

  /* fine horizontal scanlines */
  .scanlines{
    z-index:5;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.28) 3px,
      rgba(0,0,0,.28) 4px
    );
    mix-blend-mode:multiply;
  }
  /* faint vertical aperture-grille shadow mask */
  .grille{
    z-index:5;
    background:repeating-linear-gradient(
      to right,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 3px,
      rgba(0,0,0,.10) 4px
    );
    mix-blend-mode:multiply;
  }
  /* slow rolling scan band sweeping top→bottom */
  .rollband{
    z-index:6;
    height:120px;
    background:linear-gradient(
      to bottom,
      rgba(93,255,139,0) 0%,
      rgba(93,255,139,.05) 35%,
      rgba(170,255,196,.10) 50%,
      rgba(93,255,139,.05) 65%,
      rgba(93,255,139,0) 100%);
    animation:roll 7s linear infinite;
    will-change:transform;
  }
  @keyframes roll{
    0%   { transform:translateY(-140px); }
    100% { transform:translateY(420px); }
  }
  /* vignette + curvature glow */
  .vignette{
    z-index:7;
    background:
      radial-gradient(120% 130% at 50% 50%,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,.30) 80%,
        rgba(0,0,0,.72) 100%),
      radial-gradient(140% 150% at 50% 50%,
        rgba(93,255,139,.05) 0%,
        rgba(93,255,139,0) 45%);
    box-shadow:
      inset 0 0 60px rgba(0,0,0,.55),
      inset 0 0 120px rgba(0,0,0,.35);
    border-radius:14px;
  }
  /* whole-screen flicker (opacity wobble) driven by CSS, gentle */
  .flicker{
    z-index:6;
    background:rgba(93,255,139,.025);
    animation:flick 0.14s steps(2) infinite;
  }
  @keyframes flick{
    0%  { opacity:.55; }
    50% { opacity:.18; }
    100%{ opacity:.62; }
  }
  /* very slow brightness "settle" sweep for analog feel */
  .breathe{
    z-index:4;
    background:radial-gradient(120% 120% at 50% 40%, rgba(170,255,196,.06), rgba(0,0,0,0) 60%);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{opacity:.5;} 50%{opacity:1;} }

  /* tiny powered-on bezel highlight */
  .bezel{
    z-index:8;
    border-radius:14px;
    box-shadow:
      inset 0 0 0 1px rgba(93,255,139,.10),
      0 0 0 2px #000;
  }

  /* reduce-motion accessibility: calm the heaviest loops */
  @media (prefers-reduced-motion: reduce){
    .rollband,.flicker,.breathe,#stage{ animation:none; }
    .hdr .brand .cur{ animation:blink 1.4s steps(1) infinite; }
  }
</style>
</head>
<body>
  <div id="stage">
    <!-- ambient glow under content -->
    <div class="crt breathe"></div>

    <div class="frame">
      <!-- ================= HEADER ================= -->
      <div class="hdr">
        <div class="brand">homelab // node-01 <span class="cur">_</span></div>
        <div class="meta">
          <span>eth0 <b>10.0.0.12</b></span> &nbsp;·&nbsp;
          <span>kernel <b>6.8.0-rpi</b></span> &nbsp;·&nbsp;
          <span>aarch64</span> &nbsp;·&nbsp;
          <span>load <b id="hLoad">0.42</b></span>
        </div>
      </div>

      <!-- ================= COLUMNS ================= -->
      <div class="cols">
        <!-- SYSTEM LOG -->
        <div class="col">
          <div class="ctitle"><span class="hash">#</span> SYSTEM&nbsp;LOG</div>
          <div id="log"><div id="logInner"></div></div>
        </div>

        <div class="rule"></div>

        <!-- VITALS -->
        <div class="col">
          <div class="ctitle"><span class="hash">#</span> VITALS</div>
          <div id="vitals"><!-- rows injected by JS --></div>
        </div>

        <div class="rule"></div>

        <!-- STATUS -->
        <div class="col">
          <div class="ctitle"><span class="hash">#</span> STATUS</div>
          <div id="status">
            <div class="clock"><span id="clkHM">00:00</span><span class="sec" id="clkS">:00</span></div>
            <div class="dateline" id="dateLine">--- -- --- ----</div>
            <div class="uprow">UPTIME <b id="uptime">0d 00:00:00</b></div>
            <div class="svchdr">SERVICES</div>
            <div id="svc"><!-- service rows injected by JS --></div>
          </div>
        </div>
      </div>

      <!-- ================= TICKER ================= -->
      <div class="ticker"><div class="track" id="tick"></div></div>
    </div>

    <!-- ============ CRT OVERLAY STACK ============ -->
    <div class="crt rollband"></div>
    <div class="crt grille"></div>
    <div class="crt scanlines"></div>
    <div class="crt flicker"></div>
    <div class="crt vignette"></div>
    <div class="crt bezel"></div>
  </div>

<script>
(function(){
  "use strict";

  // ----------------------------------------------------------------
  // FIT: scale the fixed 1280×400 stage to fill viewport, letterboxed.
  // ----------------------------------------------------------------
  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(innerWidth/1280, innerHeight/400);
    stage.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  // ----------------------------------------------------------------
  // Small deterministic-ish helpers (no per-frame allocation in loop)
  // ----------------------------------------------------------------
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function pad2(n){ return n<10 ? '0'+n : ''+n; }

  // ================================================================
  // SYSTEM LOG
  // ================================================================
  var logInner = document.getElementById('logInner');
  var MAX_LINES = 26;                 // hard cap — bounded DOM, runs for days
  var logCount = 0;

  // Realistic homelab log pool. {src, msg, warn?}
  var INFO = [
    ['systemd',  'Started Session c$N of user root.'],
    ['systemd',  'Reached target Multi-User System.'],
    ['systemd',  'docker.service: Deactivated successfully.'],
    ['systemd',  'Starting Daily apt download activities...'],
    ['systemd',  'Finished Rotate log files.'],
    ['docker',   'container start a3f$Hnginx-proxy (image=nginx:1.27)'],
    ['docker',   'container health_status: healthy  jellyfin'],
    ['docker',   'pulled layer sha256:$H done (mediacenter)'],
    ['docker',   'network bridge homelab_default reattached'],
    ['kernel',   'EXT4-fs (sda2): mounted filesystem with ordered data mode.'],
    ['kernel',   'tcp: lan0 link up, 1000 Mbps full duplex'],
    ['kernel',   'usb 1-1.3: new high-speed USB device number $N'],
    ['kernel',   'thermal thermal_zone0: trip point 0 below 60C'],
    ['sshd',     'Accepted publickey for root from 10.0.0.5 port $P'],
    ['sshd',     'Connection closed by 10.0.0.5 port $P [preauth]'],
    ['sshd',     'pam_unix(sshd:session): session opened for root'],
    ['zfs',      'scrub repaired 0B in 00:41:1$N with 0 errors on tank'],
    ['zfs',      'pool tank: vdev mirror-0 ONLINE, 0 errors'],
    ['zfs',      'snapshot tank/data@auto-$N created'],
    ['smartd',   'Device: /dev/sda, SMART Usage Attribute 194 Temp: 38'],
    ['smartd',   'Device: /dev/sdb, self-test completed without error'],
    ['nginx',    '10.0.0.5 "GET /grafana HTTP/2" 200 1042 "-"'],
    ['nginx',    '10.0.0.7 "GET /jellyfin/web HTTP/2" 304 0 "-"'],
    ['nginx',    'reload: configuration reloaded successfully'],
    ['certbot',  'Certificate not yet due for renewal (home.lan)'],
    ['certbot',  'Renewing cert for cloud.home.lan -> OK (89d left)'],
    ['proxmox',  'VM 101 (truenas) status: running  cpu 4.1%'],
    ['proxmox',  'backup job vzdump 110 finished, size 8.4G'],
    ['pi-hole',  'gravity: 142,318 domains on blocklist'],
    ['pi-hole',  'query A jellyfin.home.lan -> 10.0.0.12 (cache)'],
    ['wireguard','peer phone-7 handshake ok, rx 1.2M tx 480K'],
    ['restic',   'snapshot $H saved, 312 files new, 1.1 GiB'],
    ['restic',   'repository check: no errors were found'],
  ];
  var WARN = [
    ['smartd',   'Device: /dev/sdb, 1 Currently unreadable sectors'],
    ['kernel',   'thermal thermal_zone0: trip point 0 crossed 72C'],
    ['nginx',    '10.0.0.9 "GET /admin HTTP/1.1" 403 162 "-"'],
    ['sshd',     'Failed password for invalid user admin from 45.$N.$N.7'],
    ['docker',   'container jellyfin unhealthy (exit code 137)'],
    ['zfs',      'pool tank: read errors detected on sdb, retrying'],
    ['systemd',  'restic-backup.service: high memory pressure'],
    ['certbot',  'renewal for vpn.home.lan deferred, ACME rate-limited'],
    ['wireguard','peer laptop-2 handshake timeout, retrying'],
  ];

  function expand(s){
    return s.replace('$N', (Math.random()*9|0)+1)
            .replace('$P', 40000 + (Math.random()*25000|0))
            .replace('$H', Math.floor(Math.random()*0xfffff).toString(16).padStart(5,'0'));
  }

  function logLine(now){
    var warn = Math.random() < 0.16;          // ~1 in 6 lines is amber WARN
    var entry = warn ? pick(WARN) : pick(INFO);
    var row = document.createElement('div');
    row.className = 'll fresh' + (warn ? ' warn' : '');
    var hh = pad2(now.getHours()), mm = pad2(now.getMinutes()), ss = pad2(now.getSeconds());
    row.innerHTML =
      '<span class="t">' + hh + ':' + mm + ':' + ss + '</span> ' +
      '<span class="lvl">' + (warn ? 'WARN' : 'info') + '</span> ' +
      '<span class="src">' + entry[0] + ':</span> ' +
      '<span class="msg">' + expand(entry[1]) + '</span>';
    logInner.appendChild(row);
    logCount++;
    // drop oldest beyond cap → bounded memory forever
    while(logCount > MAX_LINES){
      logInner.removeChild(logInner.firstChild);
      logCount--;
    }
    // strip "fresh" from the previous line so animation only hits the newest
    if(logInner.children.length > 1){
      logInner.children[logInner.children.length-2].classList.remove('fresh');
    }
  }

  // ================================================================
  // VITALS  — ASCII block bars with bounded random walk
  // ================================================================
  var BAR_W = 12;
  var FULL = '█';   // █
  var EMPTY = '░';  // ░
  var vitals = [
    { key:'CPU',  val:34, unit:'%',  min:6,  max:96, step:7,  hot:88 },
    { key:'MEM',  val:58, unit:'%',  min:22, max:94, step:4,  hot:90 },
    { key:'TEMP', val:46, unit:'°C', min:33, max:78, step:3, hot:70, disp:true },
    { key:'DISK', val:71, unit:'%',  min:60, max:93, step:2,  hot:90 },
    { key:'NET',  val:21, unit:'%',  min:1,  max:99, step:14, hot:200 }, // net never "hot"
  ];
  var vitalsEl = document.getElementById('vitals');
  // build static DOM once; only swap fill text + value each tick
  var vRefs = vitals.map(function(v){
    var row = document.createElement('div');
    row.className = 'vrow';
    row.innerHTML =
      '<span class="vlabel">'+v.key+'</span>' +
      '[<span class="vbar"><span class="fill"></span><span class="emp"></span></span>] ' +
      '<span class="vval"></span><span class="vunit"></span>';
    vitalsEl.appendChild(row);
    return {
      row: row,
      fill: row.querySelector('.fill'),
      emp:  row.querySelector('.emp'),
      val:  row.querySelector('.vval'),
      unit: row.querySelector('.vunit')
    };
  });
  // mini extra readouts under the bars
  var vmini = document.createElement('div');
  vmini.className = 'vmini';
  vitalsEl.appendChild(vmini);

  var netRx = 0, netTx = 0;

  function renderVitals(){
    for(var i=0;i<vitals.length;i++){
      var v = vitals[i], r = vRefs[i];
      // percentage used for the bar fill (TEMP maps its range to a fill %)
      var pct;
      if(v.disp){ pct = clamp((v.val - 30) / (85 - 30) * 100, 0, 100); }
      else      { pct = v.val; }
      var filled = Math.round(pct/100 * BAR_W);
      filled = clamp(filled, 0, BAR_W);
      // rebuild fill/empty strings (tiny, 12 chars — cheap)
      r.fill.textContent = FULL.repeat(filled);
      r.emp.textContent  = EMPTY.repeat(BAR_W - filled);
      r.val.textContent  = ' ' + (v.disp ? v.val.toFixed(0) : Math.round(v.val));
      r.unit.textContent = v.unit;
      var hot = v.val >= v.hot;
      if(hot) r.row.classList.add('hot'); else r.row.classList.remove('hot');
    }
    // derived NET throughput readout, drifts with NET %
    var net = vitals[4].val;
    netRx = net*1.9 + rnd(-3,3);
    netTx = net*0.7 + rnd(-2,2);
    vmini.innerHTML =
      'net0 &nbsp;rx <b>'+netRx.toFixed(1)+'</b> mbit/s &nbsp; tx <b>'+Math.max(0,netTx).toFixed(1)+'</b> mbit/s<br>' +
      'tank <b>'+vitals[3].val.toFixed(0)+'%</b> of 14.6T &nbsp;·&nbsp; procs <b>'+(118+ (Math.random()*9|0))+'</b>';
  }

  function driftVitals(){
    for(var i=0;i<vitals.length;i++){
      var v = vitals[i];
      v.val = clamp(v.val + rnd(-v.step, v.step), v.min, v.max);
    }
    // header load avg loosely tracks CPU
    document.getElementById('hLoad').textContent =
      (vitals[0].val/100 * 3.2 + 0.15).toFixed(2);
    renderVitals();
  }
  renderVitals();

  // ================================================================
  // STATUS — clock / date / uptime / services
  // ================================================================
  var clkHM = document.getElementById('clkHM');
  var clkS  = document.getElementById('clkS');
  var dateLine = document.getElementById('dateLine');
  var uptimeEl = document.getElementById('uptime');

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // boot 19d ago so the uptime reads believably; counts up live.
  var bootMs = Date.now() - (19*86400000 + 7*3600000 + 42*60000 + 11000);

  function renderClock(now){
    clkHM.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    clkS.textContent  = ':' + pad2(now.getSeconds());
    dateLine.innerHTML = DOW[now.getDay()] + ' <b>' + pad2(now.getDate()) + '</b> ' +
                         MON[now.getMonth()] + ' ' + now.getFullYear();
    var up = Math.floor((now.getTime() - bootMs)/1000);
    var d = Math.floor(up/86400); up -= d*86400;
    var h = Math.floor(up/3600);  up -= h*3600;
    var m = Math.floor(up/60);    var s = up - m*60;
    uptimeEl.textContent = d + 'd ' + pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }

  // service list — mostly OK, a couple flip to WARN occasionally
  var SERVICES = [
    'nginx','proxmox','truenas','pi-hole','wireguard',
    'jellyfin','docker','restic','certbot','smartd','zfs','sshd'
  ];
  var svcEl = document.getElementById('svc');
  var svcRefs = SERVICES.map(function(name){
    var row = document.createElement('div');
    row.className = 'svc';
    row.innerHTML = '<span class="name">'+name+'</span>' +
                    '<span class="dots"></span>' +
                    '<span class="tag ok">[ OK ]</span>';
    svcEl.appendChild(row);
    return { name:name, tag: row.querySelector('.tag'), warn:false };
  });

  function dotsFor(){ return '·'.repeat(40); } // filler dots, clipped by overflow
  svcRefs.forEach(function(r){ r.tag.parentNode.querySelector('.dots').textContent = dotsFor(); });

  function flipServices(){
    // randomly toggle: rarely set one to WARN, recover others.
    var warnCount = svcRefs.filter(function(r){return r.warn;}).length;
    svcRefs.forEach(function(r){
      if(r.warn){
        // 40% chance to recover each cycle
        if(Math.random() < 0.40){ r.warn=false; r.tag.className='tag ok'; r.tag.textContent='[ OK ]'; }
      } else if(warnCount < 2 && Math.random() < 0.05){
        r.warn=true; r.tag.className='tag warn'; r.tag.textContent='[WARN]'; warnCount++;
      }
    });
  }

  // ================================================================
  // TICKER — seamless loop (duplicate content, translate -50%)
  // ================================================================
  var tickEl = document.getElementById('tick');
  var TICK_MSGS = [
    'ALL SYSTEMS NOMINAL',
    'NODE-01 // RPi5 8GB // aarch64 // kernel 6.8.0-rpi',
    'ZFS POOL "tank" 14.6T MIRROR — HEALTHY — LAST SCRUB 41m',
    'NEXT BACKUP 02:00 (restic -> backblaze b2)',
    'CERTS OK — cloud.home.lan 89d — vpn.home.lan 61d',
    'DOCKER 11 CONTAINERS UP // JELLYFIN 2 STREAMS',
    'UPTIME 19d // 0 UNPLANNED REBOOTS THIS QUARTER',
    'PI-HOLE BLOCKING 142,318 DOMAINS // 7.4% QUERIES BLOCKED',
  ];
  function buildTicker(){
    var seg = TICK_MSGS.map(function(m){
      return '<span class="lead">▸</span> ' + m;
    }).join('<span class="sep">::</span>');
    // duplicate so a -50% translate wraps seamlessly
    var full = seg + '<span class="sep">::</span>';
    tickEl.innerHTML = full + full;
    tickEl.style.paddingLeft = '0';   // override CSS start offset; we loop on content
  }
  buildTicker();

  var tickX = 0;          // px offset
  var tickW = 0;          // width of ONE copy (half of scrollWidth)
  function measureTicker(){ tickW = tickEl.scrollWidth / 2; }
  measureTicker();
  addEventListener('resize', measureTicker);
  // fonts can change metrics once loaded — re-measure then.
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ measureTicker(); measureTicker(); });
  }

  // ================================================================
  // SINGLE rAF LOOP — each sub-animation throttled by timestamps
  // ================================================================
  var TICK_PXPS = 58;     // ticker speed px/sec

  var last = performance.now();
  var tLog = 0, tVit = 0, tClk = 0, tSvc = 0;
  var I_LOG = 1700;       // new syslog line every ~1.7s
  var I_VIT = 900;        // vitals drift cadence
  var I_CLK = 1000;       // clock / uptime tick
  var I_SVC = 4200;       // service state re-evaluation

  // seed a few log lines so it doesn't start empty
  (function seed(){
    var base = new Date();
    for(var i=0;i<14;i++){
      var d = new Date(base.getTime() - (14-i)*1700);
      logLine(d);
    }
    // clear the per-line fadein from the seed burst
    for(var j=0;j<logInner.children.length;j++) logInner.children[j].classList.remove('fresh');
  })();

  function frame(t){
    var dt = t - last; last = t;
    if(dt > 100) dt = 100;            // clamp after tab-throttle; no jump

    // ticker — every frame for smoothness, but cheap (one transform)
    if(tickW > 0){
      tickX -= TICK_PXPS * dt/1000;
      if(tickX <= -tickW) tickX += tickW;   // seamless wrap
      tickEl.style.transform = 'translateX(' + tickX.toFixed(1) + 'px)';
    }

    if(t - tClk >= I_CLK){ tClk = t; renderClock(new Date()); }
    if(t - tVit >= I_VIT){ tVit = t; driftVitals(); }
    if(t - tLog >= I_LOG){ tLog = t; logLine(new Date()); }
    if(t - tSvc >= I_SVC){ tSvc = t; flipServices(); }

    requestAnimationFrame(frame);
  }
  renderClock(new Date());
  requestAnimationFrame(frame);

})();
</script>
</body>
