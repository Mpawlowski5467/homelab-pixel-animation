<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homelab · Pixel/ASCII (amber) · 1280×400</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  /* ====================================================================
     AMBER CRT PIXEL/ASCII RACK MONITOR — single self-contained view.
     Authored at fixed 1280x400; #stage is scaled to fill the viewport,
     letterboxed on pure black. All data is mocked and drifts forever.
     ==================================================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  /* The fixed logical canvas. JS scales it via transform: scale(s). */
  #stage {
    position: relative;
    flex-shrink: 0;            /* never shrink below 1280×400 in a narrow viewport */
    width: 1280px;
    height: 400px;
    transform-origin: center center;
    background:
      radial-gradient(120% 140% at 50% 38%, #1c1207 0%, #160e05 46%, #100a03 100%);
    overflow: hidden;
    color: #ffb454;
    /* faint warm bloom around the whole panel */
    box-shadow:
      inset 0 0 90px rgba(0,0,0,0.85),
      inset 0 0 22px rgba(255,150,40,0.05);
  }

  /* Amber palette reused everywhere */
  :root { }

  /* ---- shared text styling ---- */
  .silk { font-family: 'Silkscreen', 'Share Tech Mono', ui-monospace, monospace; }
  .mono { font-family: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }

  /* ---- zone layout ---- */
  .zone { position: absolute; top: 0; height: 400px; }

  /* === ZONE 1: CLOCK (left) === */
  #zoneClock { left: 0; width: 470px; padding: 22px 0 22px 26px; }

  .panel-tag {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 3px;
    color: #a8702f; text-transform: uppercase;
    opacity: 0.92;
  }

  #clockMain {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-weight: 700;
    font-size: 92px;
    line-height: 0.96;
    color: #ffd28a;
    letter-spacing: 2px;
    margin: 12px 0 2px -2px;
    text-shadow:
      4px 4px 0 #5a2f08,        /* chunky drop shadow */
      0 0 14px rgba(255,150,40,0.45),
      0 0 30px rgba(255,120,20,0.20);
  }
  #clockColon { animation: blinkColon 1s steps(1,end) infinite; }
  @keyframes blinkColon { 0%,50%{opacity:1;} 50.01%,100%{opacity:0.18;} }

  #clockSec {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 26px; color: #ff9a3c;
    margin-left: 6px;
    text-shadow: 2px 2px 0 #5a2f08, 0 0 10px rgba(255,150,40,0.4);
    vertical-align: baseline;
  }

  #clockDate {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 16px; letter-spacing: 2px;
    color: #ffb454; margin-top: 6px;
    text-shadow: 2px 2px 0 #3a1f06;
  }

  .kv-row {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 14px;
  }
  .kv-key {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 2px; color: #b9772f;
    min-width: 64px;
  }
  .kv-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px; color: #ffcf83;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,150,40,0.25);
  }

  #quipBox {
    position: absolute;
    left: 26px; bottom: 22px; right: 18px;
    height: 56px;
  }
  #quipLabel {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: #8f5f28;
  }
  #quip {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px; color: #ffb454; line-height: 1.25;
    margin-top: 5px; min-height: 22px;
    text-shadow: 0 0 7px rgba(255,150,40,0.3);
  }
  #quip .cursor {
    display: inline-block; width: 9px; height: 16px;
    background: #ffd28a; margin-left: 2px;
    transform: translateY(2px);
    animation: caretBlink 0.8s steps(1,end) infinite;
    box-shadow: 0 0 6px rgba(255,170,60,0.6);
  }
  @keyframes caretBlink { 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }

  /* divider lines between zones */
  .divider {
    position: absolute; top: 30px; bottom: 30px; width: 2px;
    background: linear-gradient(to bottom,
      rgba(255,150,40,0) 0%, rgba(255,150,40,0.28) 18%,
      rgba(255,150,40,0.28) 82%, rgba(255,150,40,0) 100%);
  }
  #div1 { left: 470px; }
  #div2 { left: 880px; }

  /* === ZONE 2: RESOURCE MONITOR (center) === */
  #zoneRes { left: 470px; width: 410px; padding: 22px 22px 22px 28px; }

  #zoneRes .panel-tag { margin-bottom: 16px; }

  .res-row { margin-bottom: 17px; }
  .res-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .res-name {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 2px; color: #d68a39;
  }
  .res-pct {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 15px; color: #ffd28a;
    text-shadow: 0 0 8px rgba(255,150,40,0.35);
  }
  /* block bar built from monospace glyphs */
  .res-bar {
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 21px; line-height: 1; letter-spacing: 1px;
    white-space: nowrap;
    /* dim "empty" track colour as the base */
    color: #4a2f12;
  }
  .res-bar .lit  { color: #ff9a3c; text-shadow: 0 0 4px rgba(255,140,30,0.5); }
  .res-bar .glow { color: #ffe0a6; text-shadow: 0 0 9px rgba(255,180,70,0.9), 0 0 3px rgba(255,210,140,0.8); }

  #resFootnote {
    position: absolute; left: 28px; bottom: 20px; right: 18px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; color: #9a6428;
    letter-spacing: 1px;
    border-top: 1px solid rgba(255,150,40,0.14);
    padding-top: 8px;
  }
  #resFootnote b { color: #ffb454; font-weight: 400; }

  /* === ZONE 3: SERVER TOWER + HEART + NET (right) === */
  #zoneServer { left: 880px; width: 400px; padding: 20px 22px 20px 22px; }
  #zoneServer .panel-tag { margin-bottom: 10px; }

  #towerCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    width: 160px;   /* upscaled from a small backing buffer */
    height: 290px;
    margin-top: 4px;
    filter: drop-shadow(0 0 8px rgba(255,140,30,0.18));
  }

  #serverRight {
    position: absolute;
    left: 200px; top: 44px; right: 22px;
  }

  #heartCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    width: 88px; height: 80px;
    margin: 2px 0 4px -2px;
  }
  #heartLabel {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: #c0506a;
    text-shadow: 0 0 8px rgba(255,80,110,0.4);
  }

  .net-block { margin-top: 20px; }
  .net-line { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .net-key {
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; color: #b9772f;
    min-width: 42px;
  }
  .net-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 17px; color: #ffd28a; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255,150,40,0.3);
  }
  .net-val .unit { font-size: 11px; color: #b9772f; }
  #pkts { letter-spacing: 2px; }

  /* status pill */
  #statusPill {
    position: absolute; right: 22px; top: 20px;
    font-family: 'Silkscreen', 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: #0f0a03; background: #ffb454;
    padding: 3px 8px 2px; border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,150,40,0.5);
  }
  #statusPill.warn { background: #ff7a2c; }

  /* === CRT OVERLAY: scanlines + vignette === */
  #crt {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  #crt .scan {
    position: absolute; inset: 0;
    /* chunky pixel scanlines */
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.0) 0px,
      rgba(0,0,0,0.0) 2px,
      rgba(0,0,0,0.34) 2px,
      rgba(0,0,0,0.34) 4px
    );
    mix-blend-mode: multiply;
  }
  #crt .vert {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to right,
      rgba(0,0,0,0.0) 0px,
      rgba(0,0,0,0.0) 3px,
      rgba(0,0,0,0.10) 3px,
      rgba(0,0,0,0.10) 4px
    );
    mix-blend-mode: multiply;
  }
  #crt .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(125% 135% at 50% 50%,
      rgba(0,0,0,0) 52%,
      rgba(0,0,0,0.28) 78%,
      rgba(0,0,0,0.62) 100%);
  }
  /* slow rolling brightness band for live-CRT feel */
  #crt .roll {
    position: absolute; left: 0; right: 0; height: 130px;
    top: -130px;
    background: linear-gradient(to bottom,
      rgba(255,180,80,0) 0%,
      rgba(255,180,80,0.045) 50%,
      rgba(255,180,80,0) 100%);
    animation: rollDown 7s linear infinite;
  }
  @keyframes rollDown {
    0%   { transform: translateY(0); }
    100% { transform: translateY(660px); }
  }
  /* very subtle global flicker */
  #stage { animation: crtFlicker 3.3s ease-in-out infinite; }
  @keyframes crtFlicker {
    0%,100% { filter: brightness(1.00); }
    47%     { filter: brightness(0.985); }
    50%     { filter: brightness(1.02); }
    53%     { filter: brightness(0.99); }
  }
</style>
</head>
<body>
  <div id="stage">

    <!-- ============ ZONE 1: CLOCK ============ -->
    <section class="zone" id="zoneClock">
      <div class="panel-tag">HOMELAB · BASEMENT-01</div>
      <div id="clockMain" class="silk">
        <span id="cH">00</span><span id="clockColon">:</span><span id="cM">00</span><span id="clockSec">00</span>
      </div>
      <div id="clockDate" class="silk">SUN · 0000-00-00</div>

      <div class="kv-row">
        <span class="kv-key">UPTIME</span>
        <span class="kv-val" id="uptime">000d 00:00:00</span>
      </div>
      <div class="kv-row">
        <span class="kv-key">LOAD</span>
        <span class="kv-val" id="loadavg">0.00 0.00 0.00</span>
      </div>

      <div id="quipBox">
        <div id="quipLabel">~/motd $</div>
        <div id="quip"><span id="quipText"></span><span class="cursor"></span></div>
      </div>
    </section>

    <div class="divider" id="div1"></div>

    <!-- ============ ZONE 2: RESOURCE MONITOR ============ -->
    <section class="zone" id="zoneRes">
      <div class="panel-tag">RESOURCES · PROXMOX NODE</div>

      <div class="res-row" id="row-cpu">
        <div class="res-head">
          <span class="res-name">CPU</span>
          <span class="res-pct">--%</span>
        </div>
        <div class="res-bar"></div>
      </div>

      <div class="res-row" id="row-ram">
        <div class="res-head">
          <span class="res-name">RAM</span>
          <span class="res-pct">--%</span>
        </div>
        <div class="res-bar"></div>
      </div>

      <div class="res-row" id="row-temp">
        <div class="res-head">
          <span class="res-name">TEMP</span>
          <span class="res-pct">--%</span>
        </div>
        <div class="res-bar"></div>
      </div>

      <div class="res-row" id="row-disk">
        <div class="res-head">
          <span class="res-name">DISK</span>
          <span class="res-pct">--%</span>
        </div>
        <div class="res-bar"></div>
      </div>

      <div id="resFootnote">
        <span id="footRot">zfs scrub: idle</span> &nbsp;·&nbsp; svc <b id="svcUp">0/0</b> up
      </div>
    </section>

    <div class="divider" id="div2"></div>

    <!-- ============ ZONE 3: SERVER TOWER ============ -->
    <section class="zone" id="zoneServer">
      <div class="panel-tag">RACK · NODE-01</div>
      <div id="statusPill" class="silk">ONLINE</div>

      <canvas id="towerCanvas" width="64" height="116"></canvas>

      <div id="serverRight">
        <canvas id="heartCanvas" width="22" height="20"></canvas>
        <div id="heartLabel">SYS · ALIVE</div>

        <div class="net-block">
          <div class="net-line">
            <span class="net-key">NET&#9660;</span>
            <span class="net-val" id="netDown">0.0 <span class="unit">MB/s</span></span>
          </div>
          <div class="net-line">
            <span class="net-key">NET&#9650;</span>
            <span class="net-val" id="netUp">0.0 <span class="unit">MB/s</span></span>
          </div>
          <div class="net-line">
            <span class="net-key">PKTS</span>
            <span class="net-val" id="pkts">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ CRT OVERLAY ============ -->
    <div id="crt">
      <div class="roll"></div>
      <div class="scan"></div>
      <div class="vert"></div>
      <div class="vignette"></div>
    </div>
  </div>

<script>
"use strict";
(function () {
  // ---------------------------------------------------------------
  // FIT: scale the fixed 1280x400 stage to fill the viewport.
  // ---------------------------------------------------------------
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(innerWidth / 1280, innerHeight / 400);
    stage.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit);
  fit();

  // ---------------------------------------------------------------
  // Tiny deterministic-ish RNG helpers (no allocations in loop).
  // ---------------------------------------------------------------
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // ===============================================================
  // MOCK STATE — all values drift; nothing is real.
  // ===============================================================
  // Boot reference: pretend the box has been up for a while already.
  var BOOT_OFFSET_MS = (37 * 86400 + 14 * 3600 + 9 * 60 + 41) * 1000; // 37d 14:09:41
  var startWall = Date.now();

  // Resource metrics — bounded random walk in [0,100].
  var metrics = {
    cpu:  { v: 34, target: 34 },
    ram:  { v: 58, target: 58 },
    temp: { v: 47, target: 47 }, // shown as % of a 0..85C-ish scale
    disk: { v: 71, target: 71 }
  };
  // DOM refs for resource rows (cache once).
  var rows = {
    cpu:  refRow('row-cpu'),
    ram:  refRow('row-ram'),
    temp: refRow('row-temp'),
    disk: refRow('row-disk')
  };
  function refRow(id) {
    var el = document.getElementById(id);
    return {
      pct: el.querySelector('.res-pct'),
      bar: el.querySelector('.res-bar')
    };
  }

  // Net + packet counter.
  var net = { down: 4.2, up: 0.8, dTarget: 4.2, uTarget: 0.8 };
  var packets = 184203117; // climbs forever, display-capped.

  // Load average (drifts slowly).
  var load = [0.42, 0.51, 0.48];

  // Service roster for footnote / svc count.
  var SERVICES = ['nginx','proxmox','truenas','pi-hole','wireguard','restic','jellyfin','docker'];
  var svcTotal = SERVICES.length;
  var svcUpCount = svcTotal; // occasionally one "restarts"

  // Rotating footnote messages (zfs scrub / SMART / backups).
  var FOOTNOTES = [
    'zfs scrub: idle',
    'zfs scrub: tank 38% · 412MB/s',
    'SMART: all drives PASSED',
    'restic backup @ 02:00 OK',
    'docker: 19 containers',
    'pi-hole: 31.4% blocked',
    'zfs scrub: tank 71% · 388MB/s',
    'SMART short test: PASSED',
    'wireguard: 3 peers up',
    'jellyfin: 1 stream · 1080p'
  ];
  var footIdx = 0;

  // Sysadmin quips (typewriter cycle).
  var QUIPS = [
    "there is no cloud, it's just my basement",
    "it's always DNS",
    "rm -rf /worries",
    "have you tried turning it off and on again?",
    "the backup you didn't test doesn't exist",
    "99 little bugs in the code...",
    "it works on my rack",
    "sudo make me a sandwich",
    "ssh-ing into the void",
    "uptime is a lifestyle",
    "blame the firmware",
    "git push --force friday? bold."
  ];
  var quipIdx = 0;

  // ===============================================================
  // ZONE 1 — clock / date / uptime / load (DOM updates)
  // ===============================================================
  var elcH = document.getElementById('cH');
  var elcM = document.getElementById('cM');
  var elcS = document.getElementById('clockSec');
  var elDate = document.getElementById('clockDate');
  var elUptime = document.getElementById('uptime');
  var elLoad = document.getElementById('loadavg');
  var DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  function updateClock() {
    var now = new Date();
    elcH.textContent = pad2(now.getHours());
    elcM.textContent = pad2(now.getMinutes());
    elcS.textContent = pad2(now.getSeconds());
    var y = now.getFullYear();
    var mo = pad2(now.getMonth() + 1);
    var d = pad2(now.getDate());
    elDate.textContent = DOW[now.getDay()] + ' · ' + y + '-' + mo + '-' + d;

    // uptime = boot offset + wall-time elapsed since page load
    var up = BOOT_OFFSET_MS + (Date.now() - startWall);
    var secs = Math.floor(up / 1000);
    var days = Math.floor(secs / 86400); secs -= days * 86400;
    var hh = Math.floor(secs / 3600); secs -= hh * 3600;
    var mm = Math.floor(secs / 60); secs -= mm * 60;
    elUptime.textContent = days + 'd ' + pad2(hh) + ':' + pad2(mm) + ':' + pad2(secs);
  }

  function updateLoadText() {
    elLoad.textContent = load[0].toFixed(2) + ' ' + load[1].toFixed(2) + ' ' + load[2].toFixed(2);
  }

  // ---- quip typewriter (own cadence) ----
  var elQuip = document.getElementById('quipText');
  var quipPhase = 'typing';   // typing -> holding -> deleting
  var quipChars = 0;
  var quipCur = QUIPS[0];

  function stepQuip() {
    if (quipPhase === 'typing') {
      quipChars++;
      if (quipChars >= quipCur.length) { quipChars = quipCur.length; quipPhase = 'holding'; quipHold = 0; }
      elQuip.textContent = quipCur.slice(0, quipChars);
    } else if (quipPhase === 'deleting') {
      quipChars--;
      if (quipChars <= 0) {
        quipChars = 0;
        quipIdx = (quipIdx + 1) % QUIPS.length;
        quipCur = QUIPS[quipIdx];
        quipPhase = 'typing';
      }
      elQuip.textContent = quipCur.slice(0, quipChars);
    }
  }
  var quipHold = 0;

  // ===============================================================
  // ZONE 2 — resource block bars
  // ===============================================================
  var BAR_CELLS = 14; // number of block glyphs per bar
  // Build each bar from spans once; we only toggle classes/text afterwards
  // to avoid per-frame string allocation churn. We rebuild innerHTML only
  // when the lit-count actually changes.
  var barState = { cpu: -1, ram: -1, temp: -1, disk: -1 };

  function renderBar(key, pct) {
    var lit = Math.round((pct / 100) * BAR_CELLS);
    if (lit === barState[key]) return; // no change -> skip DOM work
    barState[key] = lit;

    var bar = rows[key].bar;
    // Compose markup: filled blocks (last 2 lit get .glow), then empty.
    var html = '';
    for (var i = 0; i < BAR_CELLS; i++) {
      if (i < lit) {
        var isEdge = (i >= lit - 2); // last few lit blocks glow brighter
        html += '<span class="' + (isEdge ? 'glow' : 'lit') + '">█</span>';
      } else {
        html += '░'; // light-shade "empty" cell (inherits dim colour)
      }
    }
    bar.innerHTML = html;
  }

  function updateMetricsText() {
    setPct('cpu', metrics.cpu.v);
    setPct('ram', metrics.ram.v);
    setPct('temp', metrics.temp.v);
    setPct('disk', metrics.disk.v);
  }
  function setPct(key, v) {
    // temp shown as degrees, others as %
    var txt;
    if (key === 'temp') {
      var deg = Math.round(28 + (v / 100) * 57); // map 0..100 -> 28..85C
      txt = deg + '°C';
    } else {
      txt = Math.round(v) + '%';
    }
    rows[key].pct.textContent = txt;
  }

  // ---- footnote / service count ----
  var elFoot = document.getElementById('footRot');
  var elSvc = document.getElementById('svcUp');
  function updateFootnote() {
    footIdx = (footIdx + 1) % FOOTNOTES.length;
    elFoot.textContent = FOOTNOTES[footIdx];
  }
  function updateSvc() {
    // occasionally drop a service to N-1 then recover (believable churn)
    if (Math.random() < 0.18) svcUpCount = svcTotal - 1;
    else svcUpCount = svcTotal;
    elSvc.textContent = svcUpCount + '/' + svcTotal;
    var pill = document.getElementById('statusPill');
    if (svcUpCount < svcTotal) {
      pill.textContent = 'DEGRADED'; pill.classList.add('warn');
    } else {
      pill.textContent = 'ONLINE'; pill.classList.remove('warn');
    }
  }

  // ===============================================================
  // ZONE 3a — SERVER TOWER canvas (pixel-art, ~7fps redraw)
  // ===============================================================
  var tCanvas = document.getElementById('towerCanvas');
  var tctx = tCanvas.getContext('2d', { alpha: true });
  tctx.imageSmoothingEnabled = false;
  var TW = tCanvas.width, TH = tCanvas.height; // 64 x 116 backing pixels

  // Drive bays: each has an activity LED with its own blink phase + rate.
  var BAY_COUNT = 6;
  var bays = [];
  for (var b = 0; b < BAY_COUNT; b++) {
    bays.push({
      on: Math.random() < 0.5,
      // probability of toggling each server-frame -> irregular blink
      activity: rand(0.18, 0.62),
      hueShift: 0
    });
  }
  var powerPulse = 0; // 0..1, smooth pulse for the green/amber power LED
  var ventScroll = 0; // vent grille shimmer offset

  // palette (amber set + a couple accents)
  var PAL = {
    caseDark:  '#2a1c0c',
    caseMid:   '#3a2710',
    caseLite:  '#4d3414',
    bayDark:   '#160d04',
    bayFace:   '#241608',
    ledOff:    '#5a3a16',
    ledAmber:  '#ffb454',
    ledHot:    '#ffe0a6',
    ledGreen:  '#7CFFB0',
    ledRed:    '#ff6a4a',
    ventDark:  '#1c1206',
    ventLite:  '#3a2710',
    screen:    '#0c0803'
  };

  function px(x, y, w, h, color) {
    tctx.fillStyle = color;
    tctx.fillRect(x, y, w, h);
  }

  function drawTower(dt) {
    tctx.clearRect(0, 0, TW, TH);

    // --- chassis body ---
    var cx = 6, cy = 4, cw = TW - 12, ch = TH - 8;
    // outer shadow / bevel
    px(cx + 2, cy + 2, cw, ch, '#0c0702');
    // case fill (left-lit bevel)
    px(cx, cy, cw, ch, PAL.caseMid);
    px(cx, cy, 2, ch, PAL.caseLite);          // left highlight
    px(cx, cy, cw, 2, PAL.caseLite);          // top highlight
    px(cx + cw - 2, cy, 2, ch, PAL.caseDark); // right shade
    px(cx, cy + ch - 2, cw, 2, PAL.caseDark); // bottom shade

    // --- top section: power LED + a tiny status screen + vent ---
    var topY = cy + 4;
    // power LED (pulsing) — left
    var pcol = lerpHex('#3a6b46', PAL.ledGreen, 0.35 + 0.65 * powerPulse);
    px(cx + 5, topY + 1, 4, 4, '#0c0702');
    px(cx + 5, topY + 1, 3, 3, pcol);
    if (powerPulse > 0.55) px(cx + 5, topY + 1, 1, 1, PAL.ledHot); // hot core
    // tiny mono "screen" with scrolling line
    var sx = cx + 14, sy = topY, sw = cw - 18, sh = 7;
    px(sx, sy, sw, sh, PAL.screen);
    px(sx, sy, sw, 1, '#1c1206');
    // moving amber readout dots on the mini screen
    var dots = Math.floor((ventScroll * 0.5) % sw);
    for (var dpx = 0; dpx < sw; dpx += 4) {
      var lit = ((dpx + dots) % 12) < 4;
      px(sx + dpx, sy + 3, 2, 2, lit ? PAL.ledAmber : '#241608');
    }

    // --- vent grille (just under the screen) ---
    var vY = topY + 10;
    for (var vr = 0; vr < 3; vr++) {
      var ry = vY + vr * 3;
      px(cx + 5, ry, cw - 10, 1, PAL.ventDark);
      // shimmering slot highlights scroll horizontally
      for (var vc = 0; vc < cw - 12; vc += 4) {
        var phase = ((vc + Math.floor(ventScroll)) % 16) < 2;
        px(cx + 6 + vc, ry, 2, 1, phase ? PAL.ventLite : PAL.caseDark);
      }
    }

    // --- drive bays stack ---
    var bayTop = vY + 12;
    var bayH = 11;
    var bayGap = 2;
    var bayX = cx + 5;
    var bayW = cw - 10;
    for (var i = 0; i < BAY_COUNT; i++) {
      var by = bayTop + i * (bayH + bayGap);
      if (by + bayH > cy + ch - 4) break;
      // bay recess
      px(bayX, by, bayW, bayH, PAL.bayDark);
      px(bayX + 1, by + 1, bayW - 2, bayH - 2, PAL.bayFace);
      // drive label slit (3 dim lines = the "drive sled")
      px(bayX + 4, by + 3, bayW - 18, 1, '#352107');
      px(bayX + 4, by + 6, bayW - 22, 1, '#2c1b06');
      px(bayX + 4, by + 8, bayW - 26, 1, '#2c1b06');
      // activity LED on the right of each bay
      var lx = bayX + bayW - 7, ly = by + 3;
      var bay = bays[i];
      px(lx - 1, ly - 1, 6, 6, '#0c0702'); // LED socket
      if (bay.on) {
        // amber when active; brighter core
        px(lx, ly, 4, 4, PAL.ledAmber);
        px(lx + 1, ly + 1, 2, 2, PAL.ledHot);
      } else {
        px(lx, ly, 4, 4, PAL.ledOff);
      }
    }

    // --- foot vents / branding at very bottom ---
    var fy = cy + ch - 5;
    for (var fx = cx + 5; fx < cx + cw - 5; fx += 3) {
      px(fx, fy, 1, 3, PAL.ventDark);
    }
  }

  // linear interpolate between two #rrggbb colours -> css string
  var _lh = { r: 0, g: 0, b: 0 };
  function lerpHex(a, c, t) {
    var ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    var cr = parseInt(c.slice(1, 3), 16), cg = parseInt(c.slice(3, 5), 16), cb = parseInt(c.slice(5, 7), 16);
    var r = Math.round(ar + (cr - ar) * t);
    var g = Math.round(ag + (cg - ag) * t);
    var bb = Math.round(ab + (cb - ab) * t);
    return 'rgb(' + r + ',' + g + ',' + bb + ')';
  }

  function tickServerLeds() {
    // toggle each bay LED probabilistically -> irregular blinking
    for (var i = 0; i < BAY_COUNT; i++) {
      if (Math.random() < bays[i].activity * 0.5) bays[i].on = !bays[i].on;
    }
    ventScroll += 2;
    if (ventScroll > 100000) ventScroll = 0; // guard against unbounded growth
  }

  // ===============================================================
  // ZONE 3b — beating pixel HEART canvas (~1s cardiac rhythm)
  // ===============================================================
  var hCanvas = document.getElementById('heartCanvas');
  var hctx = hCanvas.getContext('2d', { alpha: true });
  hctx.imageSmoothingEnabled = false;
  var HW = hCanvas.width, HH = hCanvas.height; // 22 x 20

  // 11x10 heart bitmap (1 = fill, 2 = highlight pixel)
  var HEART = [
    "0011011000",
    "0111111100",
    "1111111110",
    "1112111110",
    "1111111110",
    "0111111100",
    "0011111000",
    "0001110000",
    "0000100000",
    "0000000000"
  ];

  function drawHeart(scale01) {
    hctx.clearRect(0, 0, HW, HH);
    // scale01 ~ pulse 0..1; heart "fills" with brightness on beat
    var base = '#a8324a';
    var lit = lerpHex(base, '#ff6a4a', scale01);
    var hi = lerpHex('#ff8a6a', '#ffd0c0', scale01);
    var ox = 1, oy = 1; // 1px inset so the squash never clips
    // 1px vertical squash + nudge on the strong beat for a "thump"
    var squash = scale01 > 0.72 ? 1 : 0;
    for (var y = 0; y < HEART.length; y++) {
      var rowStr = HEART[y];
      for (var x = 0; x < rowStr.length; x++) {
        var c = rowStr.charAt(x);
        if (c === '0') continue;
        var col = (c === '2') ? hi : lit;
        hctx.fillStyle = col;
        hctx.fillRect(ox + x * 2, oy + y * 2 - squash, 2, 2);
      }
    }
    // bright glint that appears on the beat peak
    if (scale01 > 0.6) {
      hctx.fillStyle = '#ffe2d6';
      hctx.fillRect(ox + 3 * 2, oy + 1 * 2, 2, 2);
    }
  }

  var elHeartLabel = document.getElementById('heartLabel');
  var bpm = 72;

  // ===============================================================
  // ZONE 3c — NET + packet counter (DOM)
  // ===============================================================
  var elNetDown = document.getElementById('netDown');
  var elNetUp = document.getElementById('netUp');
  var elPkts = document.getElementById('pkts');

  function updateNetText() {
    elNetDown.innerHTML = net.down.toFixed(1) + ' <span class="unit">MB/s</span>';
    elNetUp.innerHTML = net.up.toFixed(1) + ' <span class="unit">MB/s</span>';
  }
  function updatePktsText() {
    // cap displayed digits so layout never overflows: show last 11 digits,
    // grouped. packets keeps climbing internally but we mod for display.
    var shown = packets % 100000000000; // 11 digits max
    var s = '' + shown;
    // group into 3s from the right for readability
    var out = '';
    for (var i = 0; i < s.length; i++) {
      if (i > 0 && (s.length - i) % 3 === 0) out += ' '; // thin space
      out += s.charAt(i);
    }
    elPkts.textContent = out;
  }

  // ===============================================================
  // DRIFT — bounded random walk, called on the 1.1s cadence.
  // ===============================================================
  function driftMetrics() {
    // pick new soft targets occasionally; ease v toward target each tick
    stepMetric(metrics.cpu, 6, 8, 95);
    stepMetric(metrics.ram, 3, 35, 90);
    stepMetric(metrics.temp, 2.2, 25, 82); // (as %-ish scale)
    stepMetric(metrics.disk, 0.8, 55, 86);

    // temp loosely correlates with cpu (warm under load) for believability
    metrics.temp.target = clamp(metrics.temp.target * 0.7 + metrics.cpu.v * 0.32, 25, 82);

    // load average tracks cpu, slow EMAs over the three windows
    var l = metrics.cpu.v / 100 * 1.6 + rand(-0.05, 0.05);
    load[0] = clamp(load[0] * 0.6 + l * 0.4, 0.05, 3.2);
    load[1] = clamp(load[1] * 0.8 + load[0] * 0.2, 0.05, 3.0);
    load[2] = clamp(load[2] * 0.9 + load[1] * 0.1, 0.05, 2.8);

    // net drift (download spikier than upload)
    if (Math.random() < 0.4) net.dTarget = rand(0.3, 18.5);
    if (Math.random() < 0.4) net.uTarget = rand(0.1, 6.0);
    net.down = clamp(net.down + (net.dTarget - net.down) * 0.4, 0, 30);
    net.up = clamp(net.up + (net.uTarget - net.up) * 0.4, 0, 12);

    // bpm gently wanders
    bpm = Math.round(clamp(bpm + rand(-3, 3), 58, 96));
    elHeartLabel.textContent = 'SYS · ' + bpm + ' BPM';
  }

  function stepMetric(m, walk, lo, hi) {
    // occasionally retarget; always ease current value toward target
    if (Math.random() < 0.5) {
      m.target = clamp(m.target + rand(-walk, walk), lo, hi);
    }
    m.v = clamp(m.v + (m.target - m.v) * 0.5, 0, 100);
  }

  // packets accumulate continuously based on current net throughput.
  function accumulatePackets(dtSec) {
    // ~ proportional to MB/s; tens of thousands of pps under load.
    var pps = (net.down + net.up) * 1450 + 220;
    packets += Math.round(pps * dtSec);
  }

  // ===============================================================
  // SINGLE rAF LOOP — each sub-animation throttled by its own timer.
  // ===============================================================
  var last = performance.now();
  var accDrift = 0;      // 1100ms metric/net drift
  var accServer = 0;     // ~7fps server tower redraw (142ms)
  var accClock = 0;      // 250ms clock/uptime refresh
  var accQuip = 0;       // typewriter step
  var accFoot = 0;       // 3.4s footnote rotation
  var accSvc = 0;        // 5s service-count churn
  var accPkts = 0;       // 200ms packet display refresh

  var SERVER_INTERVAL = 142; // ~7 fps

  function loop(now) {
    var dt = now - last;
    if (dt > 250) dt = 250; // clamp after tab-throttle to avoid huge jumps
    last = now;
    var dtSec = dt / 1000;

    // --- clock + uptime (4 Hz is plenty; seconds still update crisply) ---
    accClock += dt;
    if (accClock >= 200) { accClock = 0; updateClock(); }

    // --- metric / net / load drift (1.1s) ---
    accDrift += dt;
    if (accDrift >= 1100) {
      accDrift = 0;
      driftMetrics();
      updateMetricsText();
      updateLoadText();
      updateNetText();
      // re-render bars (skips DOM if lit-count unchanged)
      renderBar('cpu', metrics.cpu.v);
      renderBar('ram', metrics.ram.v);
      renderBar('temp', metrics.temp.v);
      renderBar('disk', metrics.disk.v);
    }

    // --- packet counter: accumulate every frame, repaint at 5 Hz ---
    accumulatePackets(dtSec);
    accPkts += dt;
    if (accPkts >= 200) { accPkts = 0; updatePktsText(); }

    // --- quip typewriter ---
    accQuip += dt;
    var quipStep = (quipPhase === 'deleting') ? 32 : 62; // delete faster
    if (quipPhase === 'holding') {
      quipHold += dt;
      if (quipHold > 2600) { quipPhase = 'deleting'; }
    } else if (accQuip >= quipStep) {
      accQuip = 0;
      stepQuip();
    }

    // --- footnote rotation ---
    accFoot += dt;
    if (accFoot >= 3400) { accFoot = 0; updateFootnote(); }

    // --- service-count churn ---
    accSvc += dt;
    if (accSvc >= 5000) { accSvc = 0; updateSvc(); }

    // --- heart beat (continuous, ~bpm cardiac rhythm) ---
    // cardiac envelope: two-bump (lub-dub) wave per beat period.
    var beatPeriod = 60000 / bpm; // ms per beat
    var phase = (now % beatPeriod) / beatPeriod; // 0..1
    var pulse = cardiac(phase);
    drawHeart(pulse);
    // power LED pulse reuses a slower sine for a steady breathing glow
    powerPulse = 0.5 + 0.5 * Math.sin(now * 0.0021);

    // --- server tower redraw at ~7fps ---
    accServer += dt;
    if (accServer >= SERVER_INTERVAL) {
      accServer = 0;
      tickServerLeds();
      drawTower(dt);
    }

    requestAnimationFrame(loop);
  }

  // lub-dub cardiac envelope -> 0..1 (sharp systole + smaller second bump)
  function cardiac(p) {
    // main contraction near p=0.08, second bump near p=0.34, then rest
    var a = Math.exp(-Math.pow((p - 0.08) / 0.06, 2));       // lub
    var b = 0.55 * Math.exp(-Math.pow((p - 0.30) / 0.07, 2)); // dub
    var v = a + b;
    return clamp(v, 0, 1);
  }

  // ---- prime everything once so there is no blank first frame ----
  updateClock();
  updateLoadText();
  driftMetrics();           // seed a first set of targets/values
  updateMetricsText();
  updateNetText();
  updatePktsText();
  renderBar('cpu', metrics.cpu.v);
  renderBar('ram', metrics.ram.v);
  renderBar('temp', metrics.temp.v);
  renderBar('disk', metrics.disk.v);
  updateFootnote();
  updateSvc();
  drawTower(0);
  drawHeart(0);
  elQuip.textContent = '';
  quipCur = QUIPS[0];

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
