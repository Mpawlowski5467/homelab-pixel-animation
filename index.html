<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homelab Dashboard · Pixel Strip (1280x400)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0d0c; overflow: hidden; cursor: none;
      display: flex; align-items: center; justify-content: center;
    }
    /* 320x100 backing store upscaled to fill the strip; pixelated = crisp. */
    #screen {
      image-rendering: pixelated; image-rendering: crisp-edges; display: block;
      width: min(100vw, calc(100vh * 3.2));
      aspect-ratio: 320 / 100;
      box-shadow: 0 0 0 2px #2a2a28, 0 24px 70px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="100"></canvas>

  <!-- v1 engine -->
  <script src="src/config.js"></script>
  <script src="src/palette.js"></script>
  <script src="src/spark.js"></script>
  <script src="src/effects.js"></script>
  <!-- dashboard -->
  <script src="src/dash/data.js"></script>
  <script src="src/dash/font.js"></script>
  <script src="src/dash/text.js"></script>
  <script src="src/dash/widgets.js"></script>
  <script src="src/dash/scenes.js"></script>
  <script src="src/dash/alert.js"></script>
  <script src="src/dash/main.js"></script>
</body>
</html>
